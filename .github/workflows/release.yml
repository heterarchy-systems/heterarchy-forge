name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.92.0"
  CLOUDFLARED_VERSION: "2026.6.1"
  CLOUDFLARED_DARWIN_ARM64_SHA256: "ae6ee90188ae5833c687ce937c3693e28403677607c06c65a2ff2b6a022f50e4"

jobs:
  release:
    name: macOS arm64 package
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component clippy --component rustfmt

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -n 1)"
          if [[ -z "${VERSION}" ]]; then
            echo "workspace package version is missing" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} must equal v${VERSION}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Install verified cloudflared
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/cloudflared-darwin-arm64.tgz"
          BIN_DIR="${RUNNER_TEMP}/forge-bin"
          curl --fail --location --silent --show-error \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-darwin-arm64.tgz" \
            --output "${ARCHIVE}"
          printf '%s  %s\n' "${CLOUDFLARED_DARWIN_ARM64_SHA256}" "${ARCHIVE}" | shasum -a 256 --check
          mkdir -p "${BIN_DIR}"
          tar -xzf "${ARCHIVE}" -C "${BIN_DIR}"
          chmod 0755 "${BIN_DIR}/cloudflared"
          echo "${BIN_DIR}" >> "${GITHUB_PATH}"
          "${BIN_DIR}/cloudflared" --version

      - name: Run canonical CI harness
        run: make ci

      - name: Build macOS installer
        run: rustup run "${RUST_TOOLCHAIN}" cargo xtask package

      - name: Create release checksums
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="target/dist/Heterarchy-Forge-${VERSION}-arm64.pkg"
          if [[ ! -f "${PACKAGE}" ]]; then
            echo "expected package does not exist: ${PACKAGE}" >&2
            exit 1
          fi
          (
            cd target/dist
            shasum -a 256 "Heterarchy-Forge-${VERSION}-arm64.pkg" > SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "target/dist/Heterarchy-Forge-${VERSION}-arm64.pkg" \
            "target/dist/SHA256SUMS.txt" \
            --verify-tag \
            --generate-notes \
            --title "Heterarchy Forge ${VERSION}" \
            --notes "macOS arm64 build. The current public package is ad-hoc app-signed and the Installer package is unsigned; macOS Gatekeeper may require explicit user approval until Developer ID signing and notarization are configured."
