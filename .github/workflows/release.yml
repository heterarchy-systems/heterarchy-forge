name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.98.0"
  PACKAGE_PLATFORM: "macos-aarch64"

jobs:
  release:
    name: macOS aarch64 backend package
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component clippy --component rustfmt

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -n 1)"
          if [[ -z "${VERSION}" ]]; then
            echo "workspace package version is missing" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} must equal v${VERSION}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Run canonical CI harness
        run: make ci

      - name: Build backend package
        run: rustup run "${RUST_TOOLCHAIN}" cargo xtask package

      - name: Create release checksums
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME="forge-backend-v${VERSION}-${PACKAGE_PLATFORM}.tar.gz"
          PACKAGE_PATH="dist/${PACKAGE_NAME}"
          if [[ ! -f "${PACKAGE_PATH}" ]]; then
            echo "expected package does not exist: ${PACKAGE_PATH}" >&2
            exit 1
          fi
          (
            cd dist
            shasum -a 256 "${PACKAGE_NAME}" > SHA256SUMS.txt
          )
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "${GITHUB_ENV}"
          echo "PACKAGE_PATH=${PACKAGE_PATH}" >> "${GITHUB_ENV}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "${PACKAGE_PATH}" \
            "dist/SHA256SUMS.txt" \
            --verify-tag \
            --generate-notes \
            --title "Heterarchy Forge ${VERSION}" \
            --notes "Headless backend release. Contains the locked release forge-backend binary and the operations guide. No GUI installer is produced; run the backend over loopback HTTP per OPERATIONS.md."
