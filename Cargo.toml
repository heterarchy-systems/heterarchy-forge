[workspace]
members = [
    "xtask",
    "crates/forge-domain",
    "crates/forge-workspace",
    "crates/forge-execution",
    "crates/forge-persistence",
    "crates/forge-control",
    "crates/forge-backend",
]
resolver = "3"
exclude = ["vendor/heterarchy-orchestration-policy"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Heterarchy Systems"]
repository = "https://github.com/heterarchy-systems/heterarchy-forge"

[workspace.dependencies]
heterarchy-orchestration-policy = { version = "=0.1.0" }
axum = { version = "=0.8.9", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }
blake3 = { version = "=1.8.7", default-features = false, features = ["std"] }
getrandom = { version = "=0.4.3", default-features = false }
http-body-util = { version = "=0.1.5", default-features = false }
hyper = { version = "1.11.0", default-features = false, features = ["client", "http1", "server"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["service", "tokio"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }
rustix-process = { package = "rustix", version = "=1.1.4", default-features = false, features = ["fs", "process", "std"] }
similar = { version = "=3.2.0", default-features = false, features = ["std", "text"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "2.0.20"
toml = "=0.9.12"
tokio = { version = "1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", default-features = false, features = ["rt"] }
futures-core = "0.3.31"
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
uuid = { version = "=1.25.0", features = ["serde", "v7"] }
zstd = { version = "=0.13.3", default-features = false }

[patch.crates-io]
heterarchy-orchestration-policy = { path = "vendor/heterarchy-orchestration-policy" }

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
await_holding_lock = "deny"
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
large_futures = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_const_for_fn = "allow"
